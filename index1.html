<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="style2.css">
</head>
<body>
    <div class="bg">
    <div class="formatting">
    <div class="container">
        <h1>Welcome to Ai Registration Form</h1><hr>
        <div class="form-group">
            <label for="name">Name:</label>
            <input type="text"  placeholder="Enter your name" name="name" id="name" required>
        </div>
        <div class="form-group">
            <label for="email">Email:</label>
            <input type="email"  placeholder="Enter your email" name="email" id="email">
        </div>
        <div class="form-group">
            <label for="phone">Phone:</label>
            <input type="text"  placeholder="Enter your phone number" name="phone" id="phone" required>
        </div>
        <div class="form-group">
            <label for="gender">Gender:</label>
            <div>
                <input type="radio" value="male" name="gender"> Male
                <input type="radio" value="female" name="gender">Female
            </div>
        </div>            <label for="Scope of Interests">Scope of Interests:</label>
         <div>
            <input type="checkbox" name="Scope of Interests" value="Gen Ai">Gen  Ai <br>
         </div>
         <div>
            <input type="checkbox" name="Scope of Interests" value="Machine Learning">Machine Learning <br>
         </div>
         <div>
            <input type="checkbox" name="Scope of Interests" value="Data Science">Data Science <br>
        </div>
        <button type="submit">Submit</button>
        <button type="reset">Reset</button>
    </div>
    </div>
</body>
</html>
